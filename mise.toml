[tasks.generate]
description = "Generate the Xcode project from app/project.yml"
run = "xcodegen generate --spec app/project.yml"

[tasks.build]
description = "Build the macOS app"
depends = ["generate"]
run = "xcodebuild -project app/Argentic.xcodeproj -scheme Argentic -configuration Debug -destination 'platform=macOS' -derivedDataPath app/.build/DerivedData build"

[tasks.run]
description = "Build and launch the macOS app"
depends = ["build"]
run = "open app/.build/DerivedData/Build/Products/Debug/Argentic.app"

[tasks.build-release]
description = "Build a Universal macOS Release app (pass a version, e.g. -- 0.1.0)"
depends = ["generate"]
run = "bash app/Tools/build_macos_release.sh"

[tasks.tag-release]
description = "Create and push an annotated release tag (e.g. -- v0.1.0)"
run = "bash app/Tools/tag_release.sh"

[tasks.delete-tag]
description = "Delete a release tag locally and from origin (e.g. -- v0.1.0)"
run = "bash app/Tools/delete_tag.sh"

[tasks.test]
description = "Run ArgenticCore package tests"
run = "swift test --package-path app"

[tasks.test-ci]
description = "Run a small CI-safe subset of ArgenticCore tests"
run = "swift test --package-path app --filter 'CatalogTests|CPURendererTests/test(ShortOrbitsAgainstExistingDoublePrecisionOracle|CancellationDuringLongCPUOrbit|InvalidDimensionsAndExcessiveOrbitMemoryFailSafely)|MandelbrotTests/test(CatalogAndParameterFilesKeepLegacyZeroDistinctFromClassic|ClassicSupportsOrbitReadingRendersAndCancellation)'"

[tasks.test-app]
description = "Run macOS app tests"
depends = ["generate"]
run = "xcodebuild -project app/Argentic.xcodeproj -scheme Argentic -configuration Debug -destination 'platform=macOS' -derivedDataPath app/.build/DerivedData test"

[tasks.clean]
description = "Clean package and Xcode build outputs"
depends = ["generate"]
run = "swift package --package-path app clean && xcodebuild -project app/Argentic.xcodeproj -scheme Argentic -configuration Debug -destination 'platform=macOS' -derivedDataPath app/.build/DerivedData clean"

[tasks.reset-defaults]
description = "Reset app saved defaults"
run = "defaults delete com.teq0.argentic"
